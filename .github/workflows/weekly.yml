name: Weekly Pipeline

on:
  # CRON reactivado (09-sep-26): lunes 13:00 UTC = 07:00 America/Mexico_City
  # (hora documentada del ciclo semanal). NOTA: si se vuelve a usar un
  # dispatcher externo, quitar el schedule para no duplicar corridas.
  schedule:
    - cron: '9 13 * * 1'
  # (historico) Sin `schedule:` A PROPOSITO. Las corridas de produccion las dispara un
  # agente externo por `workflow_dispatch` contra `master` (todos los runs
  # historicos son workflow_dispatch, ninguno schedule). Al pasar `master` a
  # rama por defecto, un bloque `schedule:` aqui haria que GitHub disparara
  # ADEMAS por su cuenta: dos corridas del mismo slate, el doble de creditos
  # de API y dos pasadas escribiendo apuestas.
  # Para volver a los crons de GitHub hay que apagar antes ese dispatcher.
  workflow_dispatch:
  push:
    branches: [ master ]
    paths: [ '.github/workflows/weekly.yml' ]

# Evita runs solapados del mismo pipeline
concurrency:
  group: weekly-pipeline
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly pipeline
        env:
          DB_URL:                       ${{ secrets.DB_URL }}
          ODDS_API_KEY:                 ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN:           ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:             ${{ secrets.TELEGRAM_CHAT_ID }}
          API_TTL_HOURS:                ${{ secrets.API_TTL_HOURS }}
          ODDS_REGION:                  ${{ secrets.ODDS_REGION }}
          ODDS_MARKETS:                 ${{ secrets.ODDS_MARKETS }}
          FETCH_DAYS_AHEAD:             ${{ secrets.FETCH_DAYS_AHEAD }}
          API_CREDITS_ALERT_THRESHOLD:  ${{ secrets.API_CREDITS_ALERT_THRESHOLD }}
          USER_TIMEZONE:                America/Mexico_City
        run: python scripts/orchestrator.py --mode weekly

      - name: Sanity audit
        env:
          DB_URL:              ${{ secrets.DB_URL }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          USER_TIMEZONE:       America/Mexico_City
        run: python scripts/weekly_sanity_audit.py
        continue-on-error: true

      - name: CLV calibration audit
        env:
          DB_URL:              ${{ secrets.DB_URL }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          USER_TIMEZONE:       America/Mexico_City
        run: python scripts/clv_audit.py
        continue-on-error: true   # auditoría informativa — no rompe pipeline
