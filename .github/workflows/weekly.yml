name: Weekly Pipeline

on:
  schedule:
    # Lunes 07:00 AM Mexico City (UTC-6) = 13:00 UTC
    - cron: '0 13 * * 1'
  workflow_dispatch:
  push:
    branches: [ master ]
    paths: [ '.github/workflows/weekly.yml' ]

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly pipeline
        env:
          DB_URL:                       ${{ secrets.DB_URL }}
          ODDS_API_KEY:                 ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN:           ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:             ${{ secrets.TELEGRAM_CHAT_ID }}
          API_TTL_HOURS:                ${{ secrets.API_TTL_HOURS }}
          ODDS_REGION:                  ${{ secrets.ODDS_REGION }}
          ODDS_MARKETS:                 ${{ secrets.ODDS_MARKETS }}
          FETCH_DAYS_AHEAD:             ${{ secrets.FETCH_DAYS_AHEAD }}
          API_CREDITS_ALERT_THRESHOLD:  ${{ secrets.API_CREDITS_ALERT_THRESHOLD }}
          USER_TIMEZONE:                America/Mexico_City
        run: python scripts/orchestrator.py --mode weekly

      - name: CLV calibration audit
        env:
          DB_URL:              ${{ secrets.DB_URL }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          USER_TIMEZONE:       America/Mexico_City
        run: python scripts/clv_audit.py
        continue-on-error: true   # auditoría informativa — no rompe pipeline
