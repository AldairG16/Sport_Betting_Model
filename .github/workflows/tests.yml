name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          # DB_URL no necesaria para los tests unitarios (no tocan la DB)
          DB_URL: postgresql://dummy:dummy@localhost/dummy
        run: python -m pytest tests/ -v --tb=short

      # Gate de auditoria. Corre el subconjunto barato (broken-reference +
      # config-inconsistency) y sale con codigo 1 si hay violaciones, con el
      # archivo:linea del culpable. Tarda ~2s.
      #
      # Sin bloque `env:` A PROPOSITO: la auditoria parsea el arbol con `ast`
      # y no importa `config.settings`, asi que no necesita ningun secreto.
      # Darle uno solo serviria para ocultar una regresion en esa garantia.
      #
      # Va despues de los tests para que un fallo funcional se vea primero:
      # este paso responde "el arbol quedo consistente", no "el codigo corre".
      - name: Audit CI gate
        run: python -m tools.audit --ci
