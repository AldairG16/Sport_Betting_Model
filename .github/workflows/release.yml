name: Release

# Publica una versión nueva del sistema:
#   1. Actualiza el archivo VERSION (ej. "1.2.0")
#   2. git tag v1.2.0 && git push origin v1.2.0
#   3. Este workflow compila el dashboard .exe y lo publica como GitHub
#      Release descargable (Releases → BettingDashboard-v1.2.0.exe)
#
# El dashboard local avisa al usuario cuando existe una versión más nueva.

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # necesario para crear el Release

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests before release
        env:
          DB_URL: postgresql://dummy:dummy@localhost/dummy
        run: python -m pytest tests -q

      - name: Build dashboard executable
        run: |
          python -m PyInstaller --noconfirm --onefile --name BettingDashboard `
            --distpath installer/dist --workpath installer/build `
            --specpath installer dashboard/entry.py

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: Betting Model v${{ github.ref_name }}
          generate_release_notes: true
          files: |
            installer/dist/BettingDashboard.exe
            .env.example
