name: Watchdog — Pipeline Health Monitor

# Corre cada 6 horas en minutos off-peak para evitar throttling de GH Actions.
# Si el morning (12:00 UTC) o evening (13:30 UTC) no corrieron, el watchdog
# de las 18:00 UTC lo detecta y manda alerta a Telegram.
#
# Regla: silencio = salud. Solo envía mensaje cuando algo está mal.

on:
  # Dos disparos independientes, a propósito (1-oct-26):
  #   - el latido del closing (scripts/heartbeat_dispatch.py) a las 03:00,
  #     09:00, 15:00 y 21:00 MX: puntual, porque el cron de GitHub corría con
  #     4-6 h de atraso;
  #   - este cron, como respaldo: si el closing muere, el watchdog sigue
  #     corriendo y es justo quien lo detecta.
  # Correr dos veces no daña: solo lee (no escribe en la base, no gasta
  # créditos de The Odds API ni llama a Anthropic). Silencio = salud; termina
  # en rojo si su alerta no se pudo entregar.
  schedule:
    - cron: '17 0,6,12,18 * * *'   # 00:17 / 06:17 / 12:17 / 18:17 UTC
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watchdog
        env:
          DB_URL:               ${{ secrets.DB_URL }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          # Variable del repo (no secret): declara si el loop del analista esta
          # en servicio. En "false" el watchdog omite el chequeo de heartbeat
          # en vez de alertar por un silencio que es deliberado.
          PRE_KICKOFF_ANALYST_ENABLED: ${{ vars.PRE_KICKOFF_ANALYST_ENABLED }}
        run: python scripts/watchdog.py
