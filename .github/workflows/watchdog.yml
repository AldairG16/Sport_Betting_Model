name: Watchdog — Pipeline Health Monitor

# Corre cada 6 horas en minutos off-peak para evitar throttling de GH Actions.
# Si el morning (12:00 UTC) o evening (13:30 UTC) no corrieron, el watchdog
# de las 18:00 UTC lo detecta y manda alerta a Telegram.
#
# Regla: silencio = salud. Solo envía mensaje cuando algo está mal.

on:
  # Sin `schedule:` A PROPOSITO. Las corridas de produccion las dispara un
  # agente externo por `workflow_dispatch` contra `master` (todos los runs
  # historicos son workflow_dispatch, ninguno schedule). Al pasar `master` a
  # rama por defecto, un bloque `schedule:` aqui haria que GitHub disparara
  # ADEMAS por su cuenta: dos corridas del mismo slate, el doble de creditos
  # de API y dos pasadas escribiendo apuestas.
  # Para volver a los crons de GitHub hay que apagar antes ese dispatcher.
  workflow_dispatch:                 # permite lanzar manualmente para testear

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watchdog
        env:
          DB_URL:               ${{ secrets.DB_URL }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/watchdog.py
