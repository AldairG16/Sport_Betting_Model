name: Pre-Kickoff Analyst

# Corre cada 15 min y revisa si hay apuestas confiables que arrancan en
# 30-90 min. Para cada una llama al pre_kickoff_analyst.py:
#  1. Construye contexto cuantitativo desde la DB (gratis, sin tokens)
#  2. Aplica filtro rule-based "SKIP" para descartar apuestas obvias
#  3. Solo si pasa el filtro, llama a Claude API con web_search (alineaciones,
#     lesiones de últimas 48h)
#  4. Manda el dictamen STRONG/MEDIUM/SKIP a Telegram
#
# NO modifica bets_history — las apuestas siguen pending y se resuelven
# normal en el ciclo evening.

on:
  # Sin `schedule:` A PROPOSITO. Las corridas de produccion las dispara un
  # agente externo por `workflow_dispatch` contra `master` (todos los runs
  # historicos son workflow_dispatch, ninguno schedule). Al pasar `master` a
  # rama por defecto, un bloque `schedule:` aqui haria que GitHub disparara
  # ADEMAS por su cuenta: dos corridas del mismo slate, el doble de creditos
  # de API y dos pasadas escribiendo apuestas.
  # Para volver a los crons de GitHub hay que apagar antes ese dispatcher.
  workflow_dispatch:   # manual desde la UI de Actions
    inputs:
      debug_mode:
        description: '🔧 SANITY CHECK — agarra 1 bet futura, corre Claude, reporta SUCCESS/ERROR'
        type: boolean
        required: false
        default: false
      window_min:
        description: 'Override PRE_KICKOFF_WINDOW_MIN (default 30)'
        required: false
        default: ''
      window_max:
        description: 'Override PRE_KICKOFF_WINDOW_MAX (default 90). Para debug: 99999.'
        required: false
        default: ''
  push:
    branches: [ master ]
    paths: [ '.github/workflows/pre_kickoff.yml' ]

# Si un run anterior se está ejecutando aún, lo cancelamos para evitar
# análisis duplicados (idempotencia adicional sobre el ON CONFLICT del INSERT).
concurrency:
  group: pre-kickoff
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pre-kickoff analyst
        env:
          DB_URL:                          ${{ secrets.DB_URL }}
          ANTHROPIC_API_KEY:               ${{ secrets.ANTHROPIC_API_KEY }}
          # Bot principal (fallback si no se configura el dedicado)
          TELEGRAM_BOT_TOKEN:              ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:                ${{ secrets.TELEGRAM_CHAT_ID }}
          # Bot dedicado para pre-kickoff (separa el ruido del canal principal).
          # Si no se configura, send_message_prekickoff cae al bot principal.
          TELEGRAM_BOT_TOKEN_PREKICKOFF:   ${{ secrets.TELEGRAM_BOT_TOKEN_PREKICKOFF }}
          TELEGRAM_CHAT_ID_PREKICKOFF:     ${{ secrets.TELEGRAM_CHAT_ID_PREKICKOFF }}
          # Inputs del workflow_dispatch tienen prioridad sobre secrets,
          # para poder testear con ventana ampliada (window_max=99999).
          PRE_KICKOFF_WINDOW_MIN:          ${{ inputs.window_min || secrets.PRE_KICKOFF_WINDOW_MIN }}
          PRE_KICKOFF_WINDOW_MAX:          ${{ inputs.window_max || secrets.PRE_KICKOFF_WINDOW_MAX }}
          # Tope diario de gasto en Anthropic. Si el secret no existe el módulo usa $0.30 default.
          ANTHROPIC_DAILY_BUDGET_USD:      ${{ secrets.ANTHROPIC_DAILY_BUDGET_USD }}
          USER_TIMEZONE:                   America/Mexico_City
        run: |
          if [ "${{ inputs.debug_mode }}" = "true" ]; then
            echo "🔧 Running in DEBUG MODE (--debug flag)"
            python scripts/pre_kickoff_analyst.py --debug
          else
            python scripts/pre_kickoff_analyst.py
          fi
