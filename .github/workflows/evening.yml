name: Evening Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths: [ '.github/workflows/evening.yml' ]

# Evita runs solapados del mismo pipeline
concurrency:
  group: evening-pipeline
  cancel-in-progress: false

jobs:
  evening:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore API cache
        uses: actions/cache/restore@v5
        with:
          path: data/api_cache.json
          key: odds-api-cache-${{ github.run_id }}
          restore-keys: |
            odds-api-cache-

      - name: Run evening pipeline
        env:
          DB_URL:                       ${{ secrets.DB_URL }}
          ODDS_API_KEY:                 ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN:           ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:             ${{ secrets.TELEGRAM_CHAT_ID }}
          API_TTL_HOURS:                ${{ secrets.API_TTL_HOURS }}
          ODDS_REGION:                  ${{ secrets.ODDS_REGION }}
          ODDS_MARKETS:                 ${{ secrets.ODDS_MARKETS }}
          FETCH_DAYS_AHEAD:             ${{ secrets.FETCH_DAYS_AHEAD }}
          API_CREDITS_ALERT_THRESHOLD:  ${{ secrets.API_CREDITS_ALERT_THRESHOLD }}
          API_CREDITS_STOP_THRESHOLD:   ${{ secrets.API_CREDITS_STOP_THRESHOLD }}
          MAX_CREDITS_PER_RUN:          ${{ secrets.MAX_CREDITS_PER_RUN }}
          MAX_ENRICHMENTS_PER_RUN:      ${{ secrets.MAX_ENRICHMENTS_PER_RUN }}
          # El paso "Resolve pending (Claude)" del evening las necesita: sin la
          # key imprimía "abortando" y salía verde, y nunca resolvió nada
          # (1-oct-26). El tope diario de gasto lo aplica anthropic_budget.
          ANTHROPIC_API_KEY:            ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_DAILY_BUDGET_USD:   ${{ secrets.ANTHROPIC_DAILY_BUDGET_USD }}
          USER_TIMEZONE:                America/Mexico_City
        run: python scripts/orchestrator.py --mode evening

      # Guardar el cache AUNQUE el run falle: desde el 22-sep-26 un paso
      # fallido deja el run en rojo, y actions/cache solo guarda en
      # runs exitosos — sin esto el siguiente run haría full fetch.
      - name: Save API cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: data/api_cache.json
          key: odds-api-cache-${{ github.run_id }}
