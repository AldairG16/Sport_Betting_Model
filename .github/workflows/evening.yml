name: Evening Pipeline

on:
  schedule:
    # 07:30 AM Mexico City (UTC-6) = 13:30 UTC.
    # Movido del 21:00 MX original (18-may-2026) porque football-data.co.uk
    # sube córners/tarjetas con 24-36h de lag → el evening previo cerraba
    # con 8-10 bets pending "esperando data". A las 07:30 MX fbdata ya
    # actualizó (corre ~06:00 UTC) y resolve_pending (06:30 MX) ya pasó,
    # así el resumen llega COMPLETO con wins/losses resueltos.
    # Trade-off: te enterás del ROI del día anterior 10h más tarde.
    - cron: '30 13 * * *'
  workflow_dispatch:
  push:
    branches: [ master ]
    paths: [ '.github/workflows/evening.yml' ]

jobs:
  evening:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore API cache
        uses: actions/cache@v4
        with:
          path: data/api_cache.json
          key: odds-api-cache-${{ github.run_id }}
          restore-keys: |
            odds-api-cache-

      - name: Run evening pipeline
        env:
          DB_URL:                       ${{ secrets.DB_URL }}
          ODDS_API_KEY:                 ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN:           ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:             ${{ secrets.TELEGRAM_CHAT_ID }}
          API_TTL_HOURS:                ${{ secrets.API_TTL_HOURS }}
          ODDS_REGION:                  ${{ secrets.ODDS_REGION }}
          ODDS_MARKETS:                 ${{ secrets.ODDS_MARKETS }}
          FETCH_DAYS_AHEAD:             ${{ secrets.FETCH_DAYS_AHEAD }}
          API_CREDITS_ALERT_THRESHOLD:  ${{ secrets.API_CREDITS_ALERT_THRESHOLD }}
          API_CREDITS_STOP_THRESHOLD:   ${{ secrets.API_CREDITS_STOP_THRESHOLD }}
          MAX_CREDITS_PER_RUN:          ${{ secrets.MAX_CREDITS_PER_RUN }}
          MAX_ENRICHMENTS_PER_RUN:      ${{ secrets.MAX_ENRICHMENTS_PER_RUN }}
          USER_TIMEZONE:                America/Mexico_City
        run: python scripts/orchestrator.py --mode evening
