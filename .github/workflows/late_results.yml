name: Late Results Retry

# Re-fetch resultados después del evening principal.
# Motivo: el evening corre a las 21:00 MX. Partidos que terminan tarde
# (Liga MX 20:00-22:00 MX, MLS Pacific evening, etc.) pueden no tener
# resultado en la API aún cuando corre el evening — quedan pending
# en el resumen incluso si ya terminaron.
# Este workflow corre dos veces más tarde y resuelve esas bets sin tocar
# el resumen ya enviado (es trabajo silencioso de housekeeping).

on:
  # Sin `schedule:` A PROPOSITO. Las corridas de produccion las dispara un
  # agente externo por `workflow_dispatch` contra `master` (todos los runs
  # historicos son workflow_dispatch, ninguno schedule). Al pasar `master` a
  # rama por defecto, un bloque `schedule:` aqui haria que GitHub disparara
  # ADEMAS por su cuenta: dos corridas del mismo slate, el doble de creditos
  # de API y dos pasadas escribiendo apuestas.
  # Para volver a los crons de GitHub hay que apagar antes ese dispatcher.
  workflow_dispatch:
  push:
    branches: [ master ]
    paths: [ '.github/workflows/late_results.yml' ]

# Si un run anterior se está ejecutando aún, lo cancelamos.
concurrency:
  group: late-results
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run results-only orchestrator
        env:
          DB_URL:                       ${{ secrets.DB_URL }}
          ODDS_API_KEY:                 ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN:           ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:             ${{ secrets.TELEGRAM_CHAT_ID }}
          USER_TIMEZONE:                America/Mexico_City
        run: python scripts/orchestrator.py --mode results
