name: Late Results Retry

# Re-fetch resultados después del evening principal.
# Motivo: el evening corre a las 21:00 MX. Partidos que terminan tarde
# (Liga MX 20:00-22:00 MX, MLS Pacific evening, etc.) pueden no tener
# resultado en la API aún cuando corre el evening — quedan pending
# en el resumen incluso si ya terminaron.
# Este workflow corre dos veces más tarde y resuelve esas bets sin tocar
# el resumen ya enviado (es trabajo silencioso de housekeeping).

on:
  # Segunda excepcion al criterio de 7508a0f, por el mismo motivo que el
  # watchdog: el agente externo dispara morning, closing, evening y weekly,
  # pero NO este workflow — solo corrio una vez, el 11-may-26. Un cron aqui
  # no duplica ninguna corrida, enciende la que faltaba.
  #
  # COSTE, que no es cero: `--mode results` empieza por
  # scripts/fetch_results.py, que pide el endpoint /scores de The Odds API a
  # razon de 1 credito por liga. Con 15 ligas activas son hasta 15 creditos
  # por corrida, 30 al dia entre las dos. No hay guarda de creditos en esa
  # ruta: fetch_results los cuenta pero no se detiene por umbral, a
  # diferencia de update_upcoming_matches.
  #
  # A cambio, `step_fetch_results_backup` lee football-data.co.uk, que es
  # gratis, y es justo la fuente que trae corners y tarjetas 24-36 h tarde.
  # Sin esta corrida esas bets dependen de que el evening del dia siguiente
  # las alcance.
  schedule:
    - cron: '0 6 * * *'     # 00:00 MX — atrapa partidos que acabaron tarde
    - cron: '30 12 * * *'   # 06:30 MX — ya sincronizo el CSV de fbdata
  workflow_dispatch:
  push:
    branches: [ master ]
    paths: [ '.github/workflows/late_results.yml' ]

# Si un run anterior se está ejecutando aún, lo cancelamos.
concurrency:
  group: late-results
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run results-only orchestrator
        env:
          DB_URL:                       ${{ secrets.DB_URL }}
          ODDS_API_KEY:                 ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN:           ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:             ${{ secrets.TELEGRAM_CHAT_ID }}
          USER_TIMEZONE:                America/Mexico_City
        run: python scripts/orchestrator.py --mode results
