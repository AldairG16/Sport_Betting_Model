name: Resolve Pending Bets

# Agente que usa Claude + web_search para terminar de resolver bets
# pending cuyos resultados:
#   • Football-data.co.uk aún no subió (corners/cards europeos, lag 24-36h)
#   • The Odds API no cubre (ligas chinas, sudamericanas menores)
#   • Quedaron por team-name mismatch o problema de cobertura
#
# NO crea apuestas. NO modifica probabilidades. Solo termina de resolver.
# Cap: 30 partidos por corrida (~$0.90 max).

on:
  # Sin `schedule:` a propósito: lo dispara el latido del closing a las 07:00
  # y 19:00 MX (scripts/heartbeat_dispatch.py, 1-oct-26). Del 11-may al
  # 1-oct-26 no lo disparó nadie y no corrió ni una vez; el watchdog avisa
  # ahora si pasan 30 h sin una corrida.
  workflow_dispatch:
    inputs:
      include_stale:
        description: 'Recuperación única: sumar las apuestas reales que quedaron sin fuente (stale)'
        type: boolean
        default: false
  push:
    branches: [ master ]
    paths: [ '.github/workflows/resolve_pending.yml' ]

concurrency:
  group: resolve-pending
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run resolver
        env:
          DB_URL:                ${{ secrets.DB_URL }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_DAILY_BUDGET_USD: ${{ secrets.ANTHROPIC_DAILY_BUDGET_USD }}
          USER_TIMEZONE:         America/Mexico_City
          INCLUDE_STALE:         ${{ inputs.include_stale && '1' || '' }}
        run: |
          if [ -n "$INCLUDE_STALE" ]; then
            python scripts/resolve_pending_bets.py --hours-lag 6 --limit 40 --include-stale
          else
            python scripts/resolve_pending_bets.py --hours-lag 6 --limit 15
          fi
