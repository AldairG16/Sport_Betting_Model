name: Morning Pipeline

# Trigger manual via push: cualquier modificación a este archivo lanza el
# pipeline una vez. Se usa para verificar fixes sin esperar al cron de las 6 AM.
# Última verificación: 27-abr-26 — fix UnboundLocalError en model_probs.

on:
  schedule:
    # 06:00 AM Mexico City (UTC-6) = 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:   # permite lanzar manualmente desde GitHub
  push:
    branches: [ master ]
    paths: [ '.github/workflows/morning.yml' ]

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Persistir api_cache.json entre runs — sin esto cada Action arranca
      # con cache vacío y hace full fetch (~60 créditos base + ~560 enrich).
      # Con cache persistido, el closing (6h después) y evening (15h después)
      # reutilizan lo que descargó el morning.
      - name: Restore API cache
        uses: actions/cache@v4
        with:
          path: data/api_cache.json
          key: odds-api-cache-${{ github.run_id }}
          restore-keys: |
            odds-api-cache-

      - name: Run morning pipeline
        env:
          DB_URL:                       ${{ secrets.DB_URL }}
          ODDS_API_KEY:                 ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN:           ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:             ${{ secrets.TELEGRAM_CHAT_ID }}
          API_TTL_HOURS:                ${{ secrets.API_TTL_HOURS }}
          ODDS_REGION:                  ${{ secrets.ODDS_REGION }}
          ODDS_MARKETS:                 ${{ secrets.ODDS_MARKETS }}
          FETCH_DAYS_AHEAD:             ${{ secrets.FETCH_DAYS_AHEAD }}
          API_CREDITS_ALERT_THRESHOLD:  ${{ secrets.API_CREDITS_ALERT_THRESHOLD }}
          API_CREDITS_STOP_THRESHOLD:   ${{ secrets.API_CREDITS_STOP_THRESHOLD }}
          MAX_CREDITS_PER_RUN:          ${{ secrets.MAX_CREDITS_PER_RUN }}
          MAX_ENRICHMENTS_PER_RUN:      ${{ secrets.MAX_ENRICHMENTS_PER_RUN }}
          USER_TIMEZONE:                America/Mexico_City
        run: python scripts/orchestrator.py --mode morning
