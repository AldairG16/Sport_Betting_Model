name: Closing Odds Pipeline

on:
  # CRON HORARIO reactivado (09-sep-26): el closing ahora es un loop
  # autónomo. Cada hora verifica si hay bets con kickoff en <75 min;
  # solo en esas horas fuerza el refetch de odds (~45-90 créditos) y
  # revalida las bets contra el mercado real. El resto de las horas el
  # cache TTL evita llamadas. Cubre kickoffs a cualquier hora sin
  # intervención manual.
  # NOTA: si se vuelve a usar un dispatcher externo, quitar el schedule
  # para no duplicar corridas.
  schedule:
    - cron: '5 * * * *'          # cada hora a la hora + 5 min
  workflow_dispatch:
  push:
    branches: [ master ]
    paths: [ '.github/workflows/closing.yml' ]

# Evita solapamiento: si un run horario aún está corriendo, el siguiente
# espera en cola en vez de correr en paralelo (dos runs simultáneos
# escribirían bets duplicadas y quemarían créditos).
concurrency:
  group: closing-pipeline
  cancel-in-progress: false

jobs:
  closing:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore API cache
        uses: actions/cache@v4
        with:
          path: data/api_cache.json
          key: odds-api-cache-${{ github.run_id }}
          restore-keys: |
            odds-api-cache-

      - name: Run closing odds pipeline
        env:
          DB_URL:                       ${{ secrets.DB_URL }}
          ODDS_API_KEY:                 ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN:           ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:             ${{ secrets.TELEGRAM_CHAT_ID }}
          API_TTL_HOURS:                ${{ secrets.API_TTL_HOURS }}
          ODDS_REGION:                  ${{ secrets.ODDS_REGION }}
          ODDS_MARKETS:                 ${{ secrets.ODDS_MARKETS }}
          FETCH_DAYS_AHEAD:             ${{ secrets.FETCH_DAYS_AHEAD }}
          API_CREDITS_ALERT_THRESHOLD:  ${{ secrets.API_CREDITS_ALERT_THRESHOLD }}
          API_CREDITS_STOP_THRESHOLD:   ${{ secrets.API_CREDITS_STOP_THRESHOLD }}
          MAX_CREDITS_PER_RUN:          ${{ secrets.MAX_CREDITS_PER_RUN }}
          MAX_ENRICHMENTS_PER_RUN:      ${{ secrets.MAX_ENRICHMENTS_PER_RUN }}
          USER_TIMEZONE:                America/Mexico_City
        run: python scripts/orchestrator.py --mode closing
