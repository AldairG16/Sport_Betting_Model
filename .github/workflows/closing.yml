name: Closing Odds Pipeline

on:
  # Sin `schedule:` A PROPOSITO. Las corridas de produccion las dispara un
  # agente externo por `workflow_dispatch` contra `master` (todos los runs
  # historicos son workflow_dispatch, ninguno schedule). Al pasar `master` a
  # rama por defecto, un bloque `schedule:` aqui haria que GitHub disparara
  # ADEMAS por su cuenta: dos corridas del mismo slate, el doble de creditos
  # de API y dos pasadas escribiendo apuestas.
  # Para volver a los crons de GitHub hay que apagar antes ese dispatcher.
  workflow_dispatch:
  push:
    branches: [ master ]
    paths: [ '.github/workflows/closing.yml' ]

jobs:
  closing:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore API cache
        uses: actions/cache@v4
        with:
          path: data/api_cache.json
          key: odds-api-cache-${{ github.run_id }}
          restore-keys: |
            odds-api-cache-

      - name: Run closing odds pipeline
        env:
          DB_URL:                       ${{ secrets.DB_URL }}
          ODDS_API_KEY:                 ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN:           ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:             ${{ secrets.TELEGRAM_CHAT_ID }}
          API_TTL_HOURS:                ${{ secrets.API_TTL_HOURS }}
          ODDS_REGION:                  ${{ secrets.ODDS_REGION }}
          ODDS_MARKETS:                 ${{ secrets.ODDS_MARKETS }}
          FETCH_DAYS_AHEAD:             ${{ secrets.FETCH_DAYS_AHEAD }}
          API_CREDITS_ALERT_THRESHOLD:  ${{ secrets.API_CREDITS_ALERT_THRESHOLD }}
          API_CREDITS_STOP_THRESHOLD:   ${{ secrets.API_CREDITS_STOP_THRESHOLD }}
          MAX_CREDITS_PER_RUN:          ${{ secrets.MAX_CREDITS_PER_RUN }}
          MAX_ENRICHMENTS_PER_RUN:      ${{ secrets.MAX_ENRICHMENTS_PER_RUN }}
          USER_TIMEZONE:                America/Mexico_City
        run: python scripts/orchestrator.py --mode closing
