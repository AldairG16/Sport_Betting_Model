name: Closing Odds Pipeline

on:
  # Captura de cierres (22-sep-26): recarga DIRIGIDA de las ligas con
  # kickoff en la próxima hora que tengan bets o candidatas shadow, con tope
  # de créditos por corrida (ver refresh_for_closing). Correr seguido es
  # barato e idempotente: no recarga lo descargado hace <20 min, el cierre
  # solo se reemplaza por uno más cercano al kickoff y las confirmaciones
  # se marcan como enviadas.
  # GitHub descarta muchos crons programados (medido: 18 de 73 horas el
  # 20-22 sep), así que se intenta 2 veces por hora en minutos poco
  # cargados y se recomienda ADEMÁS dispararlo cada 30 min desde el
  # dispatcher externo (docs/OPERACION.md §2): los duplicados no dañan.
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [ master ]
    paths: [ '.github/workflows/closing.yml' ]

# Evita solapamiento: si un run horario aún está corriendo, el siguiente
# espera en cola en vez de correr en paralelo (dos runs simultáneos
# escribirían bets duplicadas y quemarían créditos).
concurrency:
  group: closing-pipeline
  cancel-in-progress: false

jobs:
  closing:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore API cache
        uses: actions/cache/restore@v4
        with:
          path: data/api_cache.json
          key: odds-api-cache-${{ github.run_id }}
          restore-keys: |
            odds-api-cache-

      - name: Run closing odds pipeline
        env:
          DB_URL:                       ${{ secrets.DB_URL }}
          ODDS_API_KEY:                 ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN:           ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:             ${{ secrets.TELEGRAM_CHAT_ID }}
          API_TTL_HOURS:                ${{ secrets.API_TTL_HOURS }}
          ODDS_REGION:                  ${{ secrets.ODDS_REGION }}
          ODDS_MARKETS:                 ${{ secrets.ODDS_MARKETS }}
          FETCH_DAYS_AHEAD:             ${{ secrets.FETCH_DAYS_AHEAD }}
          API_CREDITS_ALERT_THRESHOLD:  ${{ secrets.API_CREDITS_ALERT_THRESHOLD }}
          API_CREDITS_STOP_THRESHOLD:   ${{ secrets.API_CREDITS_STOP_THRESHOLD }}
          MAX_CREDITS_PER_RUN:          ${{ secrets.MAX_CREDITS_PER_RUN }}
          MAX_ENRICHMENTS_PER_RUN:      ${{ secrets.MAX_ENRICHMENTS_PER_RUN }}
          API_FOOTBALL_KEY:             ${{ secrets.API_FOOTBALL_KEY }}
          USER_TIMEZONE:                America/Mexico_City
        run: python scripts/orchestrator.py --mode closing

      # Guardar el cache AUNQUE el run falle: desde el 22-sep-26 un paso
      # fallido deja el run en rojo, y actions/cache@v4 solo guarda en
      # runs exitosos — sin esto el siguiente run haría full fetch.
      - name: Save API cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/api_cache.json
          key: odds-api-cache-${{ github.run_id }}
